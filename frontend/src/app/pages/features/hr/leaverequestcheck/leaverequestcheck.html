<div class="attendance-container">

  <!-- Bộ lọc theo username -->
  <div class="filter-section">
    <input
      type="text"
      [(ngModel)]="filter.username"
      placeholder="Nhập username để lọc"
    />
    <select [(ngModel)]="filter.status">
  <option value="">Tất cả trạng thái</option>
  <option value="PENDING">PENDING</option>
  <option value="APPROVED">APPROVED</option>
  <option value="REJECTED">REJECTED</option>
</select>


    <button (click)="filterLeave()">Lọc</button>
  </div>

  <!-- Bảng dữ liệu nghỉ phép -->
  <div class="table-section">
    <table *ngIf="leaveRequests && leaveRequests.length > 0; else noData">
      <thead>
        <tr>
          <th>Mã đơn</th>
          <th>Username</th>
          <th>Họ tên</th>
          <th>Loại nghỉ</th>
          <th>Bắt đầu</th>
          <th>Kết thúc</th>
          <th>Lý do</th>
          <th>Ngày yêu cầu</th>
          <th>Trạng thái</th>
          <th *ngIf="role === 'hr'"></th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of leaveRequests">
          <td>{{ item.leaverequestID }}</td>
          <td>{{ item.username }}</td>
          <td>{{ item.fullname }}</td>
          <td>{{ item.leavetype }}</td>
          <td>{{ item.startdate }}</td>
          <td>{{ item.enddate }}</td>
          <td>{{ item.reason }}</td>
          <td>{{ item.requestdate }}</td>

          <td>
            <span [ngClass]="{
              'status-approved': item.status === 'APPROVED',
              'status-rejected': item.status === 'REJECTED',
              'status-pending': item.status === 'PENDING'
            }">
              {{ item.status }}
            </span>
          </td>

          <!-- Nút duyệt / từ chối -->
          <td *ngIf="item.status === 'PENDING'" style="display:flex">
            <button class="approve-btn" (click)="approve(item.leaverequestID)">
              <span class="material-symbols-outlined">
check_circle
</span>
            </button>
            <button class="reject-btn" (click)="reject(item.leaverequestID)">
              <span class="material-symbols-outlined">
              cancel
              </span>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #noData>
      <div class="no-data">Không có dữ liệu nghỉ phép</div>
    </ng-template>
  </div>
</div>
<app-loading 
  *ngIf="isloading"
></app-loading>

<app-comfirm
  *ngIf="isconfirm"
  [message]="confirmMessage"
  (result)="onConfirmResult($event)"
></app-comfirm>

<app-alert
  *ngIf="isalert"
  [message]="alertmessage"
  [notifyType]="alertType"
   (hidden)="isalert = false"
></app-alert>
