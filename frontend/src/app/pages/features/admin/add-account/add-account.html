<div class="overlay" (click)="closeForm()"></div>

<div class="modal-box">
  <!-- Header -->
  <div class="modal-header">
    <div class="header-content">
      <h3>Cấp Tài Khoản Mới</h3>
      <p>Nhập thông tin nhân viên để tạo tài khoản hệ thống</p>
    </div>
    <span class="close-btn" (click)="closeForm()">
      <span class="material-symbols-outlined">close</span>
    </span>
  </div>

  <!-- Body -->
  <div class="modal-body">
    <div class="form-grid">
      
      <!-- Họ tên -->
      <div class="form-group full-width">
        <label>Họ và Tên <span class="required">*</span></label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined icon">person</span>
          <input type="text" placeholder="VD: Nguyễn Văn A" [(ngModel)]="account.fullname" />
        </div>
      </div>

      <!-- CCCD -->
      <div class="form-group">
        <label>CCCD/CMND <span class="required">*</span></label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined icon">id_card</span>
          <input type="text" placeholder="Số giấy tờ tùy thân" [(ngModel)]="account.cccd" />
        </div>
      </div>

      <!-- Vai trò -->
      <div class="form-group">
        <label>Vai Trò <span class="required">*</span></label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined icon">badge</span>
          <select [(ngModel)]="account.role">
            <option [ngValue]="0" disabled>-- Chọn vai trò --</option>
            <option value="1">Admin</option>
            <option value="2">Nhân Sự (HR)</option>
            <option value="3">Quản Lý</option>
            <option value="4">Nhân viên</option>
          </select>
        </div>
      </div>

      <!-- Phòng ban -->
      <div class="form-group full-width">
        <label>Phòng Ban <span class="required">*</span></label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined icon">apartment</span>
          <select [(ngModel)]="account.department">
            <option [ngValue]="0" disabled>-- Chọn phòng ban --</option>
            <option *ngFor="let item of department" [value]="item.departmentId">
              {{ item.departmentName }}
            </option>
          </select>
        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div class="modal-footer">
    <button class="btn btn-cancel" (click)="closeForm()">Hủy bỏ</button>
    <button class="btn btn-primary" (click)="saveAccount()">
      <span class="material-symbols-outlined">save</span> Lưu Tài Khoản
    </button>
  </div>
</div>

<!-- Shared Components -->
<app-comfirm *ngIf="isconfirm" [message]="confirmMessage" (result)="onConfirmResult($event)"></app-comfirm>
<app-alert *ngIf="isalert" [message]="notifyMessage" [notifyType]="notifyType" (hidden)="isalert = false"></app-alert>
<app-loading *ngIf="isloading"></app-loading>
