<!-- Overlay -->
<div class="overlay" (click)="closeForm()">
  <!-- Modal Box -->
  <div class="modal-box modal-animate" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Đăng ký nghỉ phép</h3>
      <span class="material-symbols-outlined close-icon" (click)="closeForm()">close</span>
    </div>

    <div class="modal-body">
      <!-- Loại phép -->
      <div class="form-group">
        <label>Loại phép <span class="required">*</span></label>
        <select [(ngModel)]="leaveRequest.leavetype">
          <option value="">Chọn loại phép</option>
          <option *ngFor="let leave of leaveBalance" [value]="leave.leaveId">
            {{ leave.leaveType }}
          </option>
        </select>
      </div>

      <!-- Gom nhóm 2 ngày lại cho gọn -->
      <div class="row-group">
        <div class="form-group">
          <label>Ngày bắt đầu <span class="required">*</span></label>
          <input type="date" [(ngModel)]="leaveRequest.startdate" />
        </div>
        <div class="form-group">
          <label>Ngày kết thúc <span class="required">*</span></label>
          <input type="date" [(ngModel)]="leaveRequest.enddate" />
        </div>
      </div>

      <!-- Lý do -->
      <div class="form-group">
        <label>Lý do <span class="required">*</span></label>
        <textarea rows="3" placeholder="Nhập lý do chi tiết..." [(ngModel)]="leaveRequest.reason"></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-cancel" (click)="closeForm()">Hủy</button>
      <button class="btn btn-primary" (click)="submitLeaveRequest()">Lưu dữ liệu</button>
    </div>
  </div>
</div>
<!-- ... code form cũ của bạn ở trên ... -->

<!-- Overlay xác nhận -->
<app-comfirm 
  *ngIf="isconfirm" 
  [message]="confirmMessage" 
  (result)="onConfirmResult($event)">
</app-comfirm>

<!-- Thông báo Alert -->
<app-alert 
  *ngIf="isalert" 
  [message]="notifyMessage" 
  [notifyType]="notifyType" 
  (hidden)="isalert = false">
</app-alert>

<!-- Màn hình Loading -->
<app-loading *ngIf="isloading"></app-loading>
